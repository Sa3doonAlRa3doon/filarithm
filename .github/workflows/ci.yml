name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libharfbuzz-dev poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: flutter pub get
      - run: dart run build_runner build
      - run: dart format --output=none --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test

  android-debug-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build Android debug APK with repository retry
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            if flutter build apk --debug --target-platform android-arm,android-arm64; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              exit 1
            fi
            echo "Gradle dependency download failed; retrying attempt $((attempt + 1)) after $((attempt * 15)) seconds."
            sleep $((attempt * 15))
          done

  android-api24-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run quote persistence and PDF share flow on Android 7
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          profile: Nexus 5X
          disable-spellchecker: true
          script: FILARITHM_X64_ONLY=true flutter test integration_test/quote_share_test.dart --no-uninstall
