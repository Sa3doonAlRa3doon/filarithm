name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ubuntu_only:
        description: Build and validate only the Ubuntu packages
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  android:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ubuntu_only != true }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Configure signing
        env:
          KEYSTORE_B64: ${{ secrets.FILARITHM_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.FILARITHM_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.FILARITHM_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FILARITHM_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_B64"
          echo "$KEYSTORE_B64" | base64 --decode > android/filarithm-release.jks
          cat > android/key.properties <<EOF
          storeFile=filarithm-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
      - run: flutter pub get
      - run: flutter test
      - name: Build combined mobile APK
        env:
          FILARITHM_ARM_ONLY: 'true'
        run: flutter build apk --release --target-platform android-arm,android-arm64
      - run: mkdir -p dist/android && cp build/app/outputs/flutter-apk/app-release.apk dist/android/filarithm-1.0.0-mobile-arm64-armv7.apk
      - name: Build split APKs
        env:
          FILARITHM_ARM_ONLY: 'true'
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64
      - run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/filarithm-1.0.0-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/filarithm-1.0.0-armv7.apk
      - name: Build Play-distributed AAB
        run: flutter build appbundle --release --target-platform android-arm,android-arm64,android-x64
      - run: cp build/app/outputs/bundle/release/app-release.aab dist/android/filarithm-1.0.0.aab
      - name: Verify release ABIs
        run: |
          for apk in dist/android/*.apk; do
            unzip -Z1 "$apk" | grep -E '^lib/(arm64-v8a|armeabi-v7a)/' >/dev/null
            if unzip -Z1 "$apk" | grep -Eq '^lib/x86_64/'; then
              echo "Unexpected x86_64 library in $apk" >&2
              exit 1
            fi
          done
          unzip -Z1 dist/android/filarithm-1.0.0-arm64.apk | grep -q '^lib/arm64-v8a/'
          ! unzip -Z1 dist/android/filarithm-1.0.0-arm64.apk | grep -q '^lib/armeabi-v7a/'
          unzip -Z1 dist/android/filarithm-1.0.0-armv7.apk | grep -q '^lib/armeabi-v7a/'
          ! unzip -Z1 dist/android/filarithm-1.0.0-armv7.apk | grep -q '^lib/arm64-v8a/'
          unzip -Z1 dist/android/filarithm-1.0.0-mobile-arm64-armv7.apk | grep -q '^lib/arm64-v8a/'
          unzip -Z1 dist/android/filarithm-1.0.0-mobile-arm64-armv7.apk | grep -q '^lib/armeabi-v7a/'
          unzip -Z1 dist/android/filarithm-1.0.0.aab | grep -q '^base/lib/x86_64/'
      - uses: actions/upload-artifact@v4
        with:
          name: filarithm-android
          path: dist/android/*

  ubuntu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsqlite3-dev libharfbuzz-dev tesseract-ocr tesseract-ocr-eng dpkg-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true
      - name: Select package version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9] ]]; then
            version="1.0.0-ci.${GITHUB_RUN_NUMBER}"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: flutter build linux --release
      - run: chmod +x scripts/package_linux.sh && scripts/package_linux.sh "$PACKAGE_VERSION"
      - name: Install package in clean runner
        run: |
          sudo apt-get install -y "./dist/filarithm_${PACKAGE_VERSION}_amd64.deb"
          xvfb-run -a timeout 10s filarithm || test $? -eq 124
      - run: |
          suffix="${{ matrix.os }}"
          mv "dist/filarithm_${PACKAGE_VERSION}_amd64.deb" "dist/filarithm_${PACKAGE_VERSION}_${suffix}_amd64.deb"
          mv "dist/filarithm_${PACKAGE_VERSION}_linux_amd64.tar.gz" "dist/filarithm_${PACKAGE_VERSION}_${suffix}_linux_amd64.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: filarithm-${{ matrix.os }}
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ubuntu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
